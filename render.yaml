# Render.com Blueprint — one free web service runs the ENTIRE platform
# (FastAPI backend + built React frontend served as a SPA)
#
# Deploy: push to GitHub → Render Dashboard → New → Blueprint → select repo
# Then set GEMINI_API_KEY in the service's Environment settings.

services:
  - type: web
    name: catalogiq
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard — never commit
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
